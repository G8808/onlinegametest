<!DOCTYPE html>
<html>
<head>
  <title>Online Battleship</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Battleship</h1>

Room: <input id="room" value="game1">
<button onclick="join()">Join</button>

  <div id="enemyBoard" class="grid"></div>
</div>

<!-- Firebase -->

</html>
